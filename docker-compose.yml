version: "3.8"
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: ${REDIS_URL}
    depends_on:
      - redis

  redis:
    image: redis:7
    ports:
     - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
     - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 5  
    
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
        
volumes:
  redis_data: